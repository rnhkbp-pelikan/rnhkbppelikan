    <div id="lgIsi"><!--SEO:BODY--><p class="lg-load">Memuat partitur…</p><!--/SEO:BODY--></div>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/seo-render.js"></script>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const SEO = window.SEO;

    // Halaman statis (dibuat otomatis untuk Google) sudah berisi lagunya. Halaman ini juga bisa dibuka
    // langsung lewat lagu.html?id=... atau ?k=... (dipakai untuk lagu yang baru ditambahkan).
    async function muat() {
      if (window.LAGU_ID) return;
      const p = new URLSearchParams(location.search), id = p.get('id'), k = (p.get('k') || '').toLowerCase();
      if (!id && !k) { location.replace('partitur.html'); return; }
      const { sb } = await import('./partitur/common.js');   // Supabase hanya dimuat untuk halaman dinamis
      const { data, error } = await sb.from('lagu').select('*').order('judul');
      if (error) { $('lgIsi').innerHTML = '<p class="lg-load">Gagal memuat partitur. Coba lagi nanti.</p>'; return; }
      const l = data.find((x) => id ? x.id === id : String(x.id).toLowerCase().replace(/[^a-z0-9]/g, '').indexOf(k) === 0);
      if (!l) { $('lgIsi').innerHTML = '<p class="lg-load">Partitur tidak ditemukan. <a href="partitur.html">Lihat semua partitur</a></p>'; return; }
      const terkait = data.filter((x) => x.id !== l.id && x.kategori === l.kategori).concat(data.filter((x) => x.id !== l.id && x.kategori !== l.kategori));
      $('lgIsi').innerHTML = SEO.laguHTML(l, terkait);
      const m = SEO.laguMeta(l);
      document.title = m.title;
      const d = document.getElementById('seoDesc'); if (d) d.content = m.desc;
      window.LAGU_URL = SEO.urlLagu(l, true);
      const wa = $('lgWa'); if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent('Partitur ' + l.judul + (l.pencipta ? ' – ' + l.pencipta : '') + ' ' + window.LAGU_URL);
    }
    muat();

    // bagikan: menu bagikan bawaan HP, atau salin tautan
    let t;
    function toast(m) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); clearTimeout(t); t = setTimeout(() => e.classList.add('hidden'), 3500); }
    document.addEventListener('click', async (e) => {
      if (!e.target.closest('#lgShare')) return;
      const url = window.LAGU_URL || (document.querySelector('link[rel=canonical]') || {}).href || location.href;
      const judul = (document.querySelector('h1') || {}).textContent || document.title;
      if (navigator.share) { try { await navigator.share({ title: judul, text: judul + ' – Partitur R-NHKBP Pelikan', url }); return; } catch (err) { if (err && err.name === 'AbortError') return; } }
      try { await navigator.clipboard.writeText(url); toast('Tautan partitur disalin'); }
      catch (err) { window.prompt('Salin tautan ini:', url); }
    });
  </script>
